<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Debris Optics</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    canvas { position: fixed; inset: 0; display: block; }
    .logo {
      position: fixed;
      top: 32px;
      right: 40px;
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      letter-spacing: 0.25em;
      z-index: 10;
      font-family: system-ui, sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="logo">DEBRIS OPTICS</div>
  <script src="/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000510, 0.012);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(0, 0, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambient = new THREE.AmbientLight(0x0a1628, 0.6);
    scene.add(ambient);
    const keyLight = new THREE.PointLight(0x66ddff, 4, 40);
    keyLight.position.set(0, 0, 3);
    scene.add(keyLight);
    const rimLight = new THREE.PointLight(0x4488ff, 2, 30);
    rimLight.position.set(-4, 2, -2);
    scene.add(rimLight);

    const portal = new THREE.Group();
    scene.add(portal);

    // Core with better material
    const core = new THREE.Mesh(
      new THREE.SphereGeometry(1.4, 64, 64),
      new THREE.MeshStandardMaterial({
        color: 0x88ccff,
        emissive: 0x2266aa,
        emissiveIntensity: 0.8,
        metalness: 0.3,
        roughness: 0.2
      })
    );
    portal.add(core);

    const hole = new THREE.Mesh(
      new THREE.SphereGeometry(0.75, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0x000000 })
    );
    hole.position.z = 0.15;
    portal.add(hole);

    // Layered rings with standard materials
    for (let i = 0; i < 7; i++) {
      const r = 2.4 + i * 0.6;
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.04, 16, 100),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(0.55 + i * 0.015, 0.7, 0.55),
          emissive: new THREE.Color().setHSL(0.55, 0.9, 0.3),
          emissiveIntensity: 0.4,
          metalness: 0.6,
          roughness: 0.3,
          transparent: true,
          opacity: 0.5
        })
      );
      ring.rotation.x = Math.PI / 2.1;
      portal.add(ring);
    }

    // Particle field
    const count = 1200;
    const pos = new Float32Array(count * 3);
    const col = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 4 + Math.random() * 18;
      pos[i * 3] = Math.cos(angle) * radius;
      pos[i * 3 + 1] = (Math.random() - 0.5) * 12;
      pos[i * 3 + 2] = Math.sin(angle) * radius * 0.3;
      const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.08, 0.85, 0.6);
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
      size: 0.06,
      vertexColors: true,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    }));
    scene.add(particles);

    function animate() {
      requestAnimationFrame(animate);
      const t = Date.now() * 0.001;
      portal.rotation.z = t * 0.12;
      portal.rotation.y = Math.sin(t * 0.2) * 0.15;
      keyLight.intensity = 3.5 + Math.sin(t * 2) * 0.8;

      const arr = particles.geometry.attributes.position.array;
      for (let i = 0; i < count; i++) {
        arr[i * 3] += 0.03;
        if (arr[i * 3] > 22) arr[i * 3] = -22;
      }
      particles.geometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
