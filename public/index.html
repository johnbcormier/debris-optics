<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Debris Optics</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    canvas { position: fixed; inset: 0; display: block; }
    .logo {
      position: fixed;
      top: 28px;
      right: 36px;
      color: rgba(200,230,255,0.6);
      font-size: 12px;
      letter-spacing: 0.28em;
      z-index: 10;
      font-family: system-ui, sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="logo">DEBRIS OPTICS</div>
  <script src="/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000814, 0.018);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, 0, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    document.body.appendChild(renderer.domElement);

    // Lighting
    scene.add(new THREE.AmbientLight(0x0a1a30, 0.5));
    const coreLight = new THREE.PointLight(0x44ccff, 8, 50);
    coreLight.position.set(0, 0, 1);
    scene.add(coreLight);
    const sideLight = new THREE.PointLight(0x2266ff, 3, 40);
    sideLight.position.set(-6, 3, 2);
    scene.add(sideLight);

    const portal = new THREE.Group();
    scene.add(portal);

    // Vortex core (warped disc instead of sphere)
    const vortexGeo = new THREE.CylinderGeometry(0.2, 2.8, 0.4, 64, 1, true);
    const vortexMat = new THREE.MeshStandardMaterial({
      color: 0x66eeff,
      emissive: 0x2288cc,
      emissiveIntensity: 1.2,
      metalness: 0.4,
      roughness: 0.15,
      side: THREE.DoubleSide
    });
    const vortex = new THREE.Mesh(vortexGeo, vortexMat);
    vortex.rotation.x = Math.PI / 2;
    portal.add(vortex);

    // Dark singularity
    const singularity = new THREE.Mesh(
      new THREE.CircleGeometry(0.9, 64),
      new THREE.MeshBasicMaterial({ color: 0x000000 })
    );
    singularity.position.z = 0.22;
    portal.add(singularity);

    // Swirling energy ribbons
    for (let i = 0; i < 5; i++) {
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-8, (Math.random()-0.5)*4, 0),
        new THREE.Vector3(-2, (Math.random()-0.5)*2, 1),
        new THREE.Vector3(0, 0, 0.5),
        new THREE.Vector3(2, (Math.random()-0.5)*2, 1),
        new THREE.Vector3(8, (Math.random()-0.5)*4, 0)
      ]);
      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 64, 0.06, 8, false),
        new THREE.MeshStandardMaterial({
          color: 0x44ddff,
          emissive: 0x1199cc,
          emissiveIntensity: 0.7,
          transparent: true,
          opacity: 0.6
        })
      );
      portal.add(tube);
    }

    // Dense particle streams
    const count = 2000;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      positions[i*3] = (Math.random() - 0.5) * 50;
      positions[i*3+1] = (Math.random() - 0.5) * 16;
      positions[i*3+2] = (Math.random() - 0.5) * 8;
      const c = new THREE.Color().setHSL(0.52 + Math.random()*0.08, 0.9, 0.65);
      colors[i*3] = c.r;
      colors[i*3+1] = c.g;
      colors[i*3+2] = c.b;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
      size: 0.07,
      vertexColors: true,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending
    }));
    scene.add(particles);

    function animate() {
      requestAnimationFrame(animate);
      const t = Date.now() * 0.001;

      portal.rotation.z = t * 0.18;
      vortex.rotation.y = t * 0.4;
      coreLight.intensity = 7 + Math.sin(t * 3) * 1.5;

      const arr = particles.geometry.attributes.position.array;
      for (let i = 0; i < count; i++) {
        arr[i*3] += 0.05;
        if (arr[i*3] > 25) arr[i*3] = -25;
      }
      particles.geometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
